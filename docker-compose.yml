networks:
  backend-net:
    driver: bridge
    internal: true
  frontend-net:
    driver: bridge
    internal: false

volumes:
  postgres_master_data:
  postgres_replica_data:
  redis_data:
  rabbitmq_data:

services:
  nginx:
    image: nginx:alpine-slim
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
    networks:
      - backend-net
      - frontend-net

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/zzz-dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini
    environment:
      DB_HOST: pg_master
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    depends_on:
      pg_master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep php-fpm | grep -v grep"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/zzz-dev.ini:/usr/local/etc/php/conf.d/zzz-dev.ini
    environment:
      LARAVEL_QUEUE_COMMAND: ${LARAVEL_QUEUE_COMMAND:-listen}
    command: >
      sh -c "until nc -z -v -w3 rabbitmq 5672; do
               echo 'Waiting for RabbitMQ broker to accept traffic...';
               sleep 3;
             done;
             echo 'RabbitMQ is online! Booting Laravel asynchronous worker...';
             php artisan queue:$${LARAVEL_QUEUE_COMMAND} rabbitmq --queue=default --tries=3"
    depends_on:
      pg_master:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "php artisan queue:monitor rabbitmq:default"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      # This injects your .env value into the container's environment
      - REDIS_PASSWORD=${REDIS_PASSWORD:-Welcome123@}
    # FIX: Instructs Redis to boot using its environment variable directly
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # Main AMQP Messaging Port
      - "15672:15672" # Web Management Dashboard Port
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  pg_master:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel_prod}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Welcome123@}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-ReplicaSecure123@}
      # FIX: Point PGDATA to a sub-folder so Postgres controls the folder mask
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=5
      -c max_replication_slots=5
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./docker/postgres/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  pg_replica:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    user: postgres
    environment:
      PGUSER: ${POSTGRES_REPLICATION_USER:-replicator}
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-ReplicaSecure123@}
      PGHOST: pg_master
      POSTGRES_DB: ${DB_DATABASE:-laravel_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      sh -c "
      until pg_isready -h pg_master -p 5432 -U $$PGUSER; do
        echo 'Waiting for pg_master to accept traffic...';
        sleep 2;
      done;
      echo 'Master is up! Preparing directories and syncing...';

      # FIX: Natively create the subfolder pathway under the postgres user permissions
      mkdir -p $$PGDATA;
      rm -rf $$PGDATA/*;

      pg_basebackup -h pg_master -D $$PGDATA -U $$PGUSER -vP -R --slot=laravel_replica_slot;
      echo 'Sync complete! Starting PostgreSQL standby service...';
      exec postgres
      "
    depends_on:
      pg_master:
        condition: service_healthy
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$PGUSER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

