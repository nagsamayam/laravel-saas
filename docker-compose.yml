networks:
  backend-net:
    driver: bridge

volumes:
  postgres_master_data:
  postgres_replica_data:
  redis_data:
  rabbitmq_data:

services:
  nginx:
    image: nginx:alpine-slim
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - backend-net

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: always
    volumes:
      - ./:/var/www/html
      - ./docker/php/dev-overrides.ini:/usr/local/etc/php/conf.d/99-dev-overrides.ini
    environment:
      DB_HOST: pg_master
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    networks:
      - backend-net

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: always
    volumes:
      - ./:/var/www/html
      - ./docker/php/dev-overrides.ini:/usr/local/etc/php/conf.d/99-dev-overrides.ini
    command: >
      sh -c "until nc -z -v -w3 rabbitmq 5672; do
               echo 'Waiting for RabbitMQ broker to accept traffic...';
               sleep 3;
             done;
             echo 'RabbitMQ is online! Booting Laravel asynchronous worker...';
             php artisan queue:listen rabbitmq --queue=default --tries=3"
    depends_on:
      - rabbitmq
      - app
    networks:
      - backend-net

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    environment:
      # This injects your .env value into the container's environment
      - REDIS_PASSWORD=${REDIS_PASSWORD:-Welcome123@}
    # FIX: Instructs Redis to boot using its environment variable directly
    command: sh -c 'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    networks:
      - backend-net

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # Main AMQP Messaging Port
      - "15672:15672" # Web Management Dashboard Port
    networks:
      - backend-net

  pg_master:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel_prod}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Welcome123@}
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256\nhost replication all all trust"
      # FIX: Point PGDATA to a sub-folder so Postgres controls the folder mask
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres 
      -c wal_level=replica 
      -c max_wal_senders=5 
      -c max_replication_slots=5
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
    networks:
      - backend-net

  pg_replica:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    user: postgres
    environment:
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-Welcome123@}
      PGHOST: pg_master
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      sh -c "
      until pg_isready -h pg_master -p 5432 -U $$PGUSER; do
        echo 'Waiting for pg_master to accept traffic...';
        sleep 2;
      done;
      echo 'Master is up! Preparing directories and syncing...';
      
      # FIX: Natively create the subfolder pathway under the postgres user permissions
      mkdir -p $$PGDATA;
      rm -rf $$PGDATA/*;
      
      pg_basebackup -h pg_master -D $$PGDATA -U $$PGUSER -vP -R;
      echo 'Sync complete! Starting PostgreSQL standby service...';
      exec postgres
      "
    depends_on:
      - pg_master
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    networks:
      - backend-net

