name: Build and Publish Nginx Image Only

on:
  push:
    branches:
      - main # Triggers when code is merged into main
    tags:
      - 'v*' # Triggers when you create a release tag like v1.0.0

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-nginx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Mandatory permission to upload images to GHCR

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into GitHub Container Registry using the built-in system token
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Convert repository name to lowercase to prevent Docker naming errors
      - name: Inject Slug Environment Variables
        run: |
          echo "REPO_LOWER=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
      
      # Automatically extracts semantic tags and git metadata
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # 🌐 Build & Push Custom Nginx Image
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Use the tags generated automatically by the metadata step
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
