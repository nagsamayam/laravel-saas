name: Build and Publish PHP App Image Only

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docker/nginx/**'
      - '.github/workflows/deploy-nginx.yml'
    tags:
      - 'app-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 🌟 JOB 1: Build architectures in parallel speeds
  build-manifest-chunks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Separate the builds onto two distinct parallel runners
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata dynamically
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/app

      # Prepare a clean platform string string for storage tagging (e.g. linux-amd64)
      - name: Prepare Platform Variant Suffix
        id: platform_string
        run: |
          PLATFORM_STR="${{ matrix.platform }}"
          echo "variant=${PLATFORM_STR//\//-}" >> $GITHUB_OUTPUT

      # Build and push the specific platform chunk as a separate digest
      - name: Build and Push Platform Chunk
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          platforms: ${{ matrix.platform }}
          # Push by digest instead of tag directly so they can be merged later
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/app,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_ENV=production
            APP_DEBUG=false
          cache-from: type=gha,scope=${{ steps.platform_string.outputs.variant }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform_string.outputs.variant }}

      # Export the digest ID to a file so Job 2 can read it
      - name: Export Digest Configuration
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Upload the digest file to GitHub's temporary storage
      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform_string.outputs.variant }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 🌟 JOB 2: Stitch the chunks together instantly into a single version tag
  merge-manifests:
    runs-on: ubuntu-latest
    needs: build-manifest-chunks
    permissions:
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Platform Digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract Docker Metadata for Final Tagging
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create Multi-Platform Manifest and Push
        run: |
          # Convert repo name to lowercase
          REPO_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          
          # Gather all downloaded digest hashes
          DIGESTS=$(printf '${{ env.REGISTRY }}'/$REPO_LOWER/app@sha256:%s ' ' $(ls /tmp/digests))
          
          # Create and push the combined multi-arch tags
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker buildx imagetools create -t "$tag" $DIGESTS
          done
